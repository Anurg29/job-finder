[project]
name = "job"
version = "0.1.0"
description = "Job Search Platform with FastAPI, FastMCP, and Scrapers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.121.1",
    "groq>=1.2.0",
    "google-genai>=2.0.0",
    "mcp>=1.27.1,<2.0.0",
    "python-dotenv>=1.2.2",
    "python-jobspy>=1.1.82",
    "selenium>=4.44.0",
    "selenium-stealth>=1.0.6",
    "webdriver-manager>=4.1.1",
    "uvicorn>=0.31.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "bcrypt>=4.0.0",
    "supabase>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["job_search*"]
