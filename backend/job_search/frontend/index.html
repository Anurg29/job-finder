<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Search Studio</title>
  <style>
    :root {
      --bg-1: #f6efe7;
      --bg-2: #e8f0e7;
      --paper: #fcfaf6;
      --ink: #1f2a2e;
      --muted: #55656b;
      --line: #d4ddd7;
      --accent: #0f7a5f;
      --accent-2: #2f6ccf;
      --warn: #c46a2f;
      --shadow: 0 18px 38px rgba(31, 42, 46, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, #fff4d8 0 20%, transparent 42%),
        radial-gradient(circle at 90% 10%, #d8f5ef 0 22%, transparent 40%),
        linear-gradient(130deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 18px 54px;
    }

    .hero {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
      animation: rise 380ms ease-out both;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      background: #fff3;
      border: 1px solid #fff8;
      backdrop-filter: blur(5px);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #2d5550;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.9rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 740px;
    }

    .hero p {
      margin: 0;
      color: #304348;
      max-width: 720px;
    }

    .panel {
      background: color-mix(in oklab, var(--paper) 95%, white 5%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      animation: rise 440ms ease-out both;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #33464b;
      letter-spacing: 0.01em;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 1px solid #bdcbc3;
      border-radius: 12px;
      padding: 11px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      outline: none;
      transition: border 140ms ease, box-shadow 140ms ease;
    }

    input:focus {
      border-color: color-mix(in oklab, var(--accent), white 22%);
      box-shadow: 0 0 0 4px #0f7a5f1f;
    }

    .toggles {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 10px 0 14px;
    }

    .toggle {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      font-size: 13px;
      color: #2e4247;
      font-weight: 600;
    }

    .btn {
      background: linear-gradient(110deg, var(--accent), #1a8b6d);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px #0f7a5f36;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      min-height: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-2);
      margin: 10px 0 0;
    }

    .summary {
      white-space: pre-wrap;
      font-size: 14px;
      color: #1d3035;
      line-height: 1.45;
      max-height: 320px;
      overflow: auto;
      border-radius: 12px;
      border: 1px dashed #c9d5cc;
      padding: 12px;
      background: #fff;
    }

    .results {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .result-card {
      display: grid;
      gap: 6px;
      padding: 12px 13px;
      border: 1px solid #d0dbd3;
      border-radius: 12px;
      background: #fff;
      animation: rise 220ms ease-out both;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .result-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #264d42;
      background: #dff3ec;
      border: 1px solid #bfe4d8;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #45595f;
    }

    a.link {
      color: var(--accent-2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    a.link:hover {
      text-decoration: underline;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .wrap {
        padding: 20px 14px 34px;
      }
      .panel {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <span class="eyebrow">Standalone Mode</span>
      <h1>Job Search Studio</h1>
      <p>Search fresher roles across JobSpy sources, Naukri, and Internshala without depending on Claude.</p>
    </section>

    <section class="panel">
      <div class="grid">
        <div>
          <div class="field">
            <label for="query">Query</label>
            <input id="query" type="text" value="Python fresher jobs in Hyderabad, Pune, Mumbai, Bangalore">
          </div>
          <div class="field">
            <label for="roles">Roles (comma separated)</label>
            <input id="roles" type="text" value="Python Developer, AI ML Engineer">
          </div>
          <div class="field">
            <label for="cities">Cities (comma separated)</label>
            <input id="cities" type="text" value="Hyderabad, Pune, Mumbai, Bangalore">
          </div>
        </div>

        <div>
          <div class="field">
            <label for="maxResults">Max Results</label>
            <input id="maxResults" type="number" value="120" min="10" max="500">
          </div>
          <div class="field">
            <label for="naukriPages">Naukri Pages</label>
            <input id="naukriPages" type="number" value="1" min="1" max="5">
          </div>
          <div class="field">
            <label for="internshalaPages">Internshala Pages</label>
            <input id="internshalaPages" type="number" value="1" min="1" max="5">
          </div>
        </div>
      </div>

      <div class="toggles">
        <label class="toggle"><input id="includeNaukri" type="checkbox"> Include Naukri</label>
        <label class="toggle"><input id="includeInternshala" type="checkbox"> Include Internshala</label>
      </div>

      <button id="searchBtn" class="btn">Search Jobs</button>
      <p class="status" id="status"></p>
      <p class="muted">Tip: disable Naukri for faster runs if Chrome automation is blocked.</p>
    </section>

    <section class="panel" style="margin-top: 16px;">
      <h2 style="margin: 0 0 10px; font-size: 1.1rem;">Summary</h2>
      <div id="summary" class="summary">Run a search to see formatted output.</div>
    </section>

    <section class="panel" style="margin-top: 16px;">
      <h2 id="resultsTitle" style="margin: 0 0 10px; font-size: 1.1rem;">Results</h2>
      <div id="results" class="results"></div>
    </section>
  </div>

  <script>
    const el = {
      query: document.getElementById("query"),
      roles: document.getElementById("roles"),
      cities: document.getElementById("cities"),
      maxResults: document.getElementById("maxResults"),
      naukriPages: document.getElementById("naukriPages"),
      internshalaPages: document.getElementById("internshalaPages"),
      includeNaukri: document.getElementById("includeNaukri"),
      includeInternshala: document.getElementById("includeInternshala"),
      status: document.getElementById("status"),
      summary: document.getElementById("summary"),
      resultsTitle: document.getElementById("resultsTitle"),
      results: document.getElementById("results"),
      searchBtn: document.getElementById("searchBtn")
    };

    const splitCsv = (value) =>
      value
        .split(",")
        .map((item) => item.trim())
        .filter(Boolean);

    function renderResults(items) {
      el.results.innerHTML = "";
      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "No jobs found for this run.";
        el.results.appendChild(empty);
        return;
      }

      for (const job of items) {
        const card = document.createElement("article");
        card.className = "result-card";

        const head = document.createElement("div");
        head.className = "result-head";

        const title = document.createElement("h3");
        title.className = "result-title";
        title.textContent = job.title || "N/A";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = job.source || "unknown";

        head.appendChild(title);
        head.appendChild(badge);

        const meta = document.createElement("div");
        meta.className = "row";
        meta.textContent = `${job.company || "N/A"} | ${job.location || "N/A"} | Posted: ${job.date_posted || "N/A"}`;

        const link = document.createElement("a");
        link.className = "link";
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = "Open Job Link";
        link.href = job.job_url || "#";

        card.appendChild(head);
        card.appendChild(meta);
        card.appendChild(link);
        el.results.appendChild(card);
      }
    }

    async function search() {
      const payload = {
        query: el.query.value.trim(),
        roles: splitCsv(el.roles.value),
        cities: splitCsv(el.cities.value),
        include_naukri: el.includeNaukri.checked,
        include_internshala: el.includeInternshala.checked,
        naukri_pages: Number(el.naukriPages.value) || 1,
        internshala_pages: Number(el.internshalaPages.value) || 1,
        max_results: Number(el.maxResults.value) || 120
      };

      el.searchBtn.disabled = true;
      el.status.textContent = "Searching sources. This can take some time.";
      el.summary.textContent = "Working...";
      el.results.innerHTML = "";
      el.resultsTitle.textContent = "Results";

      try {
        const apiUrl = window.location.origin.startsWith("http") ? "/api/search" : "http://127.0.0.1:8002/api/search";
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await response.text();
        console.log("Response status:", response.status);
        console.log("Response text:", text);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${text}`);
        }

        const data = JSON.parse(text);
        el.status.textContent = `Done. ${data.total_jobs} jobs returned.`;
        el.summary.textContent = data.summary || "No summary available.";
        el.resultsTitle.textContent = `Results (${data.total_jobs})`;
        renderResults(data.jobs || []);
      } catch (error) {
        el.status.textContent = `Error: ${error.message}`;
        el.summary.textContent = "Search failed. Check server logs and try again.";
      } finally {
        el.searchBtn.disabled = false;
      }
    }

    el.searchBtn.addEventListener("click", search);
  </script>
</body>
</html>
